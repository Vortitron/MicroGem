name: Release

# Runs when a GitHub release is published. HACS installs straight from the
# release's tag; this job checks the tag matches the integration's version and
# attaches a zip for people who install by hand.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  attach-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches manifest.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(jq -r .version custom_components/microgem/manifest.json)"
          echo "tag $tag, manifest $version"
          test "$tag" = "$version"

      - name: Zip the integration
        run: |
          cd custom_components/microgem
          zip -r "$GITHUB_WORKSPACE/microgem.zip" . -x '__pycache__/*' '*/__pycache__/*'

      - name: Attach the zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" microgem.zip --clobber
