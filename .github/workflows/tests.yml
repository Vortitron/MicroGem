name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    name: Engine and standalone panel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e '.[test]'
      - run: pytest

  home-assistant:
    name: Home Assistant integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # pytest-homeassistant-custom-component follows the latest
          # Home Assistant release, which needs Python 3.14.
          python-version: "3.14"
      - run: pip install pytest-homeassistant-custom-component home-assistant-frontend
      - run: pytest -c tests_ha/pytest.ini --rootdir=. tests_ha
