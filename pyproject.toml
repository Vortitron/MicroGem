[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "microgem"
version = "0.4.0"
description = "A virtual MicroGEM / GEM 80 style programmable controller with a web front panel"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.9"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
microgem = "microgem.server:main"

[tool.setuptools.packages.find]
include = ["microgem*"]

[tool.setuptools.package-data]
microgem = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
